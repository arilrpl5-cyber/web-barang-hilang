<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifikasi — Lost & Found School</title><link rel="icon" href="/static/images/favicon.svg">
<link rel="stylesheet" href="/static/css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"></head>
<body><div class="layout">
<aside class="sidebar"><a class="brand" href="/"><span class="logo"><svg class="ic"><use href="#i-logo"/></svg></span> L&amp;F School</a>
<a href="/dashboard"><svg class="ic"><use href="#i-grid"/></svg> Dashboard</a><a href="/reports"><svg class="ic"><use href="#i-search"/></svg> Cari Barang</a><a href="/my-reports"><svg class="ic"><use href="#i-file"/></svg> Laporan Saya</a><a href="/claims"><svg class="ic"><use href="#i-clipboard"/></svg> Klaim Saya</a><a href="/notifications" class="active"><svg class="ic"><use href="#i-bell"/></svg> Notifikasi</a><a href="/profile"><svg class="ic"><use href="#i-user"/></svg> Profil</a><a href="#" onclick="logout()"><svg class="ic"><use href="#i-logout"/></svg> Logout</a></aside>
<div class="main"><button class="hamburger" id="hamburger"><svg class="ic"><use href="#i-menu"/></svg></button>
<div style="display:flex;justify-content:space-between;align-items:center"><h1>Notifikasi</h1><button class="btn btn-sm" id="readAll">Tandai sudah dibaca</button></div>
<div id="list"><p style="color:var(--text2)">Memuat...</p></div></div></div>
<script src="/static/js/icons.js"></script>
<script src="/static/js/app.js"></script>
<script>
async function load(){
  const r=await api('/api/notifications');
  const el=document.getElementById('list');
  if(!r.success||!r.data.length){el.innerHTML='<div class="empty"><span class="big-ic">'+icon('bell',26)+'</span><h3>Tidak ada notifikasi baru.</h3></div>';return;}
  el.innerHTML=r.data.map(n=>`<div class="notif ${n.is_read?'':'unread'}"><span class="tile">${icon('bell')}</span><div style="flex:1"><b>${n.title}</b> <span class="badge">${n.type}</span><div style="color:var(--text2);font-size:13px;margin-top:4px">${n.message}</div><div style="color:var(--muted);font-size:12px;margin-top:4px">${fmtDate(n.created_at)}</div></div>${n.is_read?'':'<button class="btn btn-sm" onclick="markRead('+n.id+')">Tandai dibaca</button>'}</div>`).join('');
}
async function markRead(id){await api('/api/notifications/'+id+'/read',{method:'PUT'});load();refreshNotifBadge();}
document.getElementById('readAll').onclick=async()=>{await api('/api/notifications/read-all',{method:'PUT'});load();refreshNotifBadge();};
load();
</script></body></html>
