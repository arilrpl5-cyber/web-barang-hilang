<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil — Lost & Found School</title><link rel="icon" href="/static/images/favicon.svg">
<link rel="stylesheet" href="/static/css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"></head>
<body><div class="layout">
<aside class="sidebar"><a class="brand" href="/"><span class="logo"><svg class="ic"><use href="#i-logo"/></svg></span> L&amp;F School</a>
<a href="/dashboard"><svg class="ic"><use href="#i-grid"/></svg> Dashboard</a><a href="/reports"><svg class="ic"><use href="#i-search"/></svg> Cari Barang</a><a href="/my-reports"><svg class="ic"><use href="#i-file"/></svg> Laporan Saya</a><a href="/claims"><svg class="ic"><use href="#i-clipboard"/></svg> Klaim Saya</a><a href="/notifications"><svg class="ic"><use href="#i-bell"/></svg> Notifikasi</a><a href="/profile" class="active"><svg class="ic"><use href="#i-user"/></svg> Profil</a><a href="#" onclick="logout()"><svg class="ic"><use href="#i-logout"/></svg> Logout</a></aside>
<div class="main"><button class="hamburger" id="hamburger"><svg class="ic"><use href="#i-menu"/></svg></button>
<h1>Profil</h1><div class="detail-grid">
<div class="form-card" style="max-width:none"><h3>Edit Profil</h3><div id="info"></div>
<label>Nama</label><input id="pName"><label>NIS/NISN</label><input id="pNis">
<button class="btn btn-primary" id="btnSave" style="margin-top:12px">Simpan</button></div>
<div class="form-card" style="max-width:none"><h3>Ganti Password</h3>
<label>Password lama</label><input id="oPw" type="password"><label>Password baru</label><input id="nPw" type="password"><label>Konfirmasi password</label><input id="cPw" type="password">
<button class="btn" id="btnPw" style="margin-top:12px">Ubah Password</button></div>
</div></div></div>
<script src="/static/js/icons.js"></script>
<script src="/static/js/app.js"></script>
<script>
(async()=>{
  const r=await api('/api/profile');
  if(!r.success)return;
  const d=r.data;
  document.getElementById('info').innerHTML=`<div class="kv"><span>Email</span><span>${d.email}</span></div><div class="kv"><span>Role</span><span>${d.role}</span></div><div class="kv"><span>Terdaftar</span><span>${fmtDate(d.created_at)}</span></div>`;
  pName.value=d.name;pNis.value=d.nis_nisn;
})();
btnSave.onclick=async()=>{const r=await api('/api/profile',{method:'PUT',body:JSON.stringify({name:pName.value,nis_nisn:pNis.value})});toast(r.message);};
btnPw.onclick=async()=>{const r=await api('/api/profile/password',{method:'PUT',body:JSON.stringify({old_password:oPw.value,new_password:nPw.value,confirm_password:cPw.value})});toast(r.message);};
</script></body></html>
